name: Build macOS
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Ad-hoc codesign
        run: |
          for f in $(find build -name "*.vst3" -o -name "*.component" -o -name "*.app" | grep "_artefacts"); do
            codesign --force --deep -s - "$f"
          done
      - name: Raccogli
        run: |
          mkdir -p out
          find build -path "*_artefacts/Release/*" \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) -maxdepth 6 -exec cp -R {} out/ \;
          cd out && zip -r ../LimiterSpettrale-macOS.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: LimiterSpettrale-macOS
          path: LimiterSpettrale-macOS.zip
